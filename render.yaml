services:
  - type: web
    name: planner-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # you paste this in Render dashboard
      - key: MODEL
        value: openai/gpt-oss-20b
      - key: MAX_AGENT_STEPS
        value: "8"
      - key: DATABASE_URL
        fromDatabase:
          name: planner-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false          # paste your Vercel URL after frontend deploy

databases:
  - name: planner-db
    plan: free
